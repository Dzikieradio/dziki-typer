<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziki Typer</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #001d16;
      color: white;
    }

    header {
      text-align: center;
      padding: 35px 15px;
      background: linear-gradient(135deg,#00843d,#00652f);
      border-bottom: 4px solid #20d987;
    }

    header h1 {
      font-size: 38px;
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
      font-size: 18px;
      opacity: .9;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .auth-box {
      max-width: 450px;
      margin: 20px auto;
      background: #0b3528;
      border: 1px solid #246c51;
      border-radius: 22px;
      padding: 24px;
    }

    .auth-box h2 {
      text-align: center;
      margin-top: 0;
      font-size: 28px;
    }

    .auth-box input {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border-radius: 12px;
      border: 1px solid #318263;
      background: #001d16;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border-radius: 12px;
      background: #20cf78;
      color: white;
      font-size: 17px;
    }

    .secondary-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      background: transparent;
      color: #37df93;
      border: 1px solid #37df93;
      font-size: 16px;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      line-height: 1.4;
    }

    .userbar {
      background: #0b3528;
      border: 1px solid #246c51;
      padding: 14px;
      border-radius: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    .logout {
      margin-top: 10px;
      padding: 8px 18px;
      border-radius: 10px;
      background: #163f33;
      color: white;
      border: 1px solid #37df93;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 5px 0 20px;
    }

    .filter {
      flex: 0 0 auto;
      padding: 12px 18px;
      border-radius: 30px;
      background: transparent;
      color: white;
      border: 1px solid #246c51;
    }

    .filter.active {
      background: #20cf78;
    }

    h2.title {
      font-size: 30px;
      margin: 25px 0;
    }

    .league-title {
      color: #45df9a;
      font-size: 20px;
      margin: 25px 5px 15px;
      font-weight: bold;
    }

    .match {
      background: #0b3528;
      border: 1px solid #246c51;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .date {
      text-align: center;
      color: #b7d0c6;
      margin-bottom: 20px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 40px 1fr;
      align-items: center;
      gap: 5px;
    }
