<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dziki Typer</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header><h1>⚽ Dziki Typer</h1><p>Powiat żywiecki • sezon 2026/2027</p></header><section id="auth" class="panel"><h2>Logowanie</h2><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Hasło (min. 8 znaków)"><button onclick="login()">Zaloguj się</button><button class="secondary" onclick="register()">Załóż konto</button><div id="message"></div></section><main id="app" class="hidden"><div class="userbar"><span id="userInfo"></span><button class="small" onclick="logout()">Wyloguj</button></div><div class="filters"><button data-f="all" class="active">Wszystkie</button><button data-f="okregowa">Okręgówka</button><button data-f="a">A Klasa</button><button data-f="b">B Klasa</button></div><div id="status"></div><div id="matches"></div><section class="rules"><b>Punktacja</b><br>🎯 Dokładny wynik: 3 pkt<br>✅ Dobry zwycięzca/remis: 1 pkt<br>❌ Błędny typ: 0 pkt</section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="matches.js"></script><script src="app.js"></script></body></html>
